name: Build Android APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --stacktrace --no-daemon
        env: { ANDROID_HOME: /usr/local/lib/android/sdk, ANDROID_SDK_ROOT: /usr/local/lib/android/sdk }
      - uses: actions/upload-artifact@v4
        with: { name: lifeos-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }